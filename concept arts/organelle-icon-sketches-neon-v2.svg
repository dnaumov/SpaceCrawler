<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <style>
      :root {
        --toxic: #7CFF00;
        --purple: #D238FF;
        --blue: #00D9FF;
        --peach: #FFD1B8;
        --teal: #00E0C6;
        --bg: #07111D;
        --tile: #101C2B;
        --ink: #EAFBFF;
      }
      .bg { fill: var(--bg); }
      .tile { fill: var(--tile); stroke: #254058; stroke-width: 4; }
      .title { fill: var(--ink); font: 52px "Segoe UI", Arial, sans-serif; font-weight: 700; text-anchor: middle; }
      .note { fill: #9EB8C4; font: 25px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .label { fill: #D8F6FF; font: 28px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .line { fill: none; stroke: var(--ink); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .purple { fill: var(--purple); }
      .toxic { fill: var(--toxic); }
      .blue { fill: var(--blue); }
      .peach { fill: var(--peach); }
      .teal { fill: var(--teal); }
      .dark { fill: var(--bg); }
      .softPurple { fill: var(--purple); opacity: .32; }
      .softBlue { fill: var(--blue); opacity: .25; }
      .softToxic { fill: var(--toxic); opacity: .28; }
      .softTeal { fill: var(--teal); opacity: .28; }
      .softPeach { fill: var(--peach); opacity: .32; }
    </style>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EAFBFF"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1200"/>
  <text class="title" x="800" y="76">Space Crawler organelle icons — neon circular pass</text>
  <text class="note" x="800" y="118">Active = purple core. Passive = peach core. Sensors = hollow center with antenna extensions.</text>

  <!-- Common circular neon style, 7 x 2 grid -->

  <g transform="translate(80 170)">
    <rect class="tile" width="180" height="180" rx="28"/>
